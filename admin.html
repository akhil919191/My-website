<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Compensation — Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Malayalam",sans-serif;background:linear-gradient(135deg,#eef4ff,#f4fbf8);color:#10233f}
.wrap{max-width:920px;margin:auto;padding:16px}
.header{background:linear-gradient(135deg,#123d8d,#176f62);color:white;padding:20px;border-radius:20px;margin-bottom:14px;box-shadow:0 10px 30px #10233f25}
.header h1{margin:0 0 5px;font-size:24px}.header p{margin:0;opacity:.9}
.card{background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 7px 25px #10233f10}
h2,h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;border:1px solid #d7dfeb;border-radius:12px;margin:6px 0 12px;font-size:15px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.primary{background:#155eef;color:#fff}.green{background:#087f5b;color:#fff}.danger{background:#d92d20;color:#fff}.light{background:#eef3fa;color:#10233f}
.row{border:1px solid #e1e7f0;border-radius:16px;padding:14px;margin:10px 0;background:#fff}
.row:hover{box-shadow:0 8px 22px #155eef12;border-color:#b9cdf6}
.rowhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.num{font-size:18px;font-weight:900}.name{font-size:16px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:110px}
.hidden{display:none!important}.msg{padding:10px;border-radius:10px;margin-top:8px}
.ok{background:#e9f8f0;color:#12633f}.err{background:#fff0f1;color:#a32934}
.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail{background:#f7f9fc;border-radius:12px;padding:11px}.detail b{display:block;font-size:12px;color:#667085;margin-bottom:4px}.crop-detail{margin-bottom:8px}
.photo{width:100%;max-height:430px;object-fit:contain;border-radius:14px;background:#eef2f6;margin-top:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar button{flex:1;min-width:130px}
@media(max-width:650px){.wrap{padding:10px}.detailgrid{grid-template-columns:1fr}.header{padding:16px}.actions button,.toolbar button{min-height:44px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📋 Compensation — Admin</h1>
    <p>Verification Report</p>
  </div>

  <div class="card" id="loginCard">
    <h2>🔐 Admin Login</h2>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Login</button>
    <div id="loginMsg"></div>
  </div>

  <div id="adminArea" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button class="primary" id="reportBtn">📋 Verification Report</button>
        <button class="light" id="logoutBtn">🚪 Logout</button>
      </div>
    </div>

    <div class="card hidden" id="reportCard">
      <h2>📋 Verification Report</h2>
      <input id="search" placeholder="🔎 Application No. / Applicant Name search">
      <div id="list">Report തുറക്കാൻ button അമർത്തുക.</div>
    </div>

    <div class="card hidden" id="detailsCard">
      <div class="toolbar">
        <button class="light" id="backBtn">← Back</button>
        <button class="primary" id="editBtn">✏️ Edit</button>
        <button class="danger" id="deleteBtn">🗑️ Delete</button>
      </div>
      <hr>
      <h2>Application Details</h2>
      <div id="details"></div>
      <div id="photoBox"></div>
      <h3 style="margin-top:18px">💬 Comment / Remarks</h3>
      <textarea id="comment" rows="4" placeholder="Remarks എഴുതുക"></textarea>
      <button class="green" id="saveCommentBtn">Save Comment</button>
      <div id="commentMsg"></div>
      <div id="commentsList" style="margin-top:10px"></div>
    </div>

    <div class="card hidden" id="editCard">
      <h2>✏️ Edit Application</h2>
      <div id="cropEditHint" style="background:#eef6ff;border-radius:12px;padding:10px;margin-bottom:10px;color:#174a8b;font-weight:700">🌾 വിളയുടെ വിശദാംശങ്ങൾ: വിള – അവസ്ഥ – എണ്ണം എന്ന രീതിയിൽ തിരുത്താം.</div><div id="editForm"></div>
      <div class="toolbar">
        <button class="green" id="updateBtn">Save Changes</button>
        <button class="light" id="cancelEditBtn">Cancel</button>
      </div>
      <div id="editMsg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jrccmucxwgebdurcokix.supabase.co";
const SUPABASE_KEY="sb_publishable_-IbSEjr2Nn_TpO-jRAujUQ_q-kugYET";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cases=[], currentCase=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function show(el,on=true){el.classList.toggle("hidden",!on)}
function msg(id,text,ok=false){$(id).innerHTML=text?'<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>':''}

async function applySession(session){
  const logged=!!session;
  show($("loginCard"),!logged);
  show($("adminArea"),logged);
  if(!logged){
    show($("reportCard"),false); show($("detailsCard"),false); show($("editCard"),false);
    cases=[]; currentCase=null;
  }
}
async function init(){
  const {data}=await db.auth.getSession();
  await applySession(data.session);
}
$("loginBtn").onclick=async()=>{
  msg("loginMsg","Logging in...",true);
  const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){msg("loginMsg",error.message);return}
  msg("loginMsg","Login successful",true); await applySession(data.session);
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();};
db.auth.onAuthStateChange((_event,session)=>applySession(session));

$("reportBtn").onclick=async()=>{
  if(!(await db.auth.getSession()).data.session){await db.auth.signOut();return}
  show($("reportCard"),true); show($("detailsCard"),false); show($("editCard"),false);
  await loadCases();
};

async function loadCases(){
  $("list").textContent="Loading...";
  const {data,error}=await db.from("compensation_cases").select("*").order("created_at",{ascending:true});
  if(error){$("list").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
  cases=data||[]; renderCases(cases);
}
function renderCases(rows){
  if(!rows.length){$("list").textContent="No applications found.";return}
  $("list").innerHTML=rows.map((r,i)=>`
    <div class="row" data-id="${esc(r.id)}">
      <div class="rowhead"><div><div class="num">${i+1}. ${esc(r.application_no||"Application No. ഇല്ല")}</div><div class="name">${esc(r.applicant_name)}</div></div></div>
      <div class="actions">
        <button class="primary" onclick="openCase('${r.id}')">Open</button>
        <button class="light" onclick="startEdit('${r.id}')">✏️ Edit</button>
        <button class="danger" onclick="deleteCase('${r.id}')">🗑️ Delete</button>
      </div>
    </div>`).join("");
}
$("search").oninput=function(){
  const q=this.value.trim().toLowerCase();
  renderCases(cases.filter(r=>String(r.application_no||"").toLowerCase().includes(q)||String(r.applicant_name||"").toLowerCase().includes(q)));
};

const labels={
 application_no:"അപേക്ഷ നമ്പർ",applicant_name:"അപേക്ഷകന്റെ പേര്",applicant_address:"അപേക്ഷകന്റെ വിലാസം",
 age:"വയസ്സ്",mobile:"മൊബൈൽ നമ്പർ",damage_location:"കൃഷിനാശം സംഭവിച്ച സ്ഥലം",
 wild_animal:"കൃഷിനാശം വരുത്തിയ വന്യമൃഗം",gun_license:"Gun ലൈസൻസ്",
 forest_crime_accused:"വന സംബന്ധമായ കുറ്റകൃത്യങ്ങളിൽ പ്രതിയാണോ",damaged_crops:"🌾 നാശം സംഭവിച്ച വിളകളുടെ വിശദാംശങ്ങൾ",
 damaged_crop_count:"നാശം സംഭവിച്ച വിളകളുടെ എണ്ണം",damage_details:"കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ",
 latitude:"Latitude",longitude:"Longitude",witness_names:"സാക്ഷിയുടെ പേര്",witness_numbers:"സാക്ഷിയുടെ നമ്പർ",
 officer_name:"പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ",area:"വിസ്തീർണ്ണം",compensation_amount:"നഷ്ടപരിഹാര തുക"
};
function cropDetailsHtml(value){
  if(!value) return "";
  const parts=String(value).split(",").map(x=>x.trim()).filter(Boolean);
  return parts.map(x=>{
    const m=x.match(/^(.+?)\s*[–-]\s*(.+?)\s*[–-]\s*(\d+)\s*എണ്ണം$/);
    if(m) return '<div class="detail"><b>🌾 വിള</b>'+esc(m[1])+'<br><b>അവസ്ഥ</b>'+esc(m[2])+'<br><b>എണ്ണം</b>'+esc(m[3])+' എണ്ണം</div>';
    return '<div class="detail"><b>🌾 വിള</b>'+esc(x)+'</div>';
  }).join("");
}

window.openCase=async function(id){
  const {data,error}=await db.from("compensation_cases").select("*").eq("id",id).single();
  if(error){alert(error.message);return} currentCase=data;
  show($("reportCard"),false);show($("editCard"),false);show($("detailsCard"),true);
  let h='<div class="detailgrid">';
  Object.keys(labels).forEach(k=>{
    if(data[k]!==null && data[k]!==undefined && data[k]!==""){
      if(k==="damaged_crops") h+=cropDetailsHtml(data[k]);
      else h+=`<div class="detail"><b>${labels[k]}</b>${esc(data[k])}</div>`;
    }
  });
  h+='</div>'; $("details").innerHTML=h;
  $("photoBox").innerHTML="";
  if(data.photo_name){
    const {data:p}=await db.storage.from("compensation-photos").createSignedUrl(data.photo_name,3600);
    if(p?.signedUrl) $("photoBox").innerHTML='<h3 style="margin-top:18px">📷 സ്ഥലം ഫോട്ടോ</h3><img class="photo" src="'+esc(p.signedUrl)+'" alt="Photo">';
  }
  await loadComments(id);
};
$("backBtn").onclick=()=>{show($("detailsCard"),false);show($("reportCard"),true);loadCases()};
$("editBtn").onclick=()=>{if(currentCase) startEdit(currentCase.id)};
window.startEdit=async function(id){
  const c=cases.find(x=>x.id===id)||currentCase;
  if(!c)return;
  currentCase=c;
  show($("reportCard"),false);show($("detailsCard"),false);show($("editCard"),true);
  const fields=[
    ["application_no","അപേക്ഷ നമ്പർ","text"],["applicant_name","അപേക്ഷകന്റെ പേര്","text"],
    ["applicant_address","അപേക്ഷകന്റെ വിലാസം","textarea"],["age","വയസ്സ്","number"],["mobile","മൊബൈൽ നമ്പർ","text"],
    ["damage_location","കൃഷിനാശം സംഭവിച്ച സ്ഥലം","text"],["wild_animal","വന്യമൃഗം","text"],
    ["gun_license","Gun ലൈസൻസ്","select"],["forest_crime_accused","വന കുറ്റകൃത്യത്തിൽ പ്രതിയാണോ","select"],
    ["damaged_crops","🌾 നാശം സംഭവിച്ച വിളകളുടെ വിശദാംശങ്ങൾ (വിള – അവസ്ഥ – എണ്ണം)","textarea"],
    ["damage_details","കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ","textarea"],["latitude","Latitude","text"],["longitude","Longitude","text"],
    ["witness_names","സാക്ഷിയുടെ പേര്","text"],["witness_numbers","സാക്ഷിയുടെ നമ്പർ","text"],
    ["officer_name","പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ","text"],["area","വിസ്തീർണ്ണം","text"],["compensation_amount","നഷ്ടപരിഹാര തുക","number"]
  ];
  $("editForm").innerHTML=fields.map(([k,l,t])=>{
    if(t==="textarea") return `<label>${l}</label><textarea id="e_${k}" rows="3">${esc(c[k]||"")}</textarea>`;
    if(t==="select") return `<label>${l}</label><select id="e_${k}"><option value="">തിരഞ്ഞെടുക്കുക</option><option value="ഉണ്ട്" ${c[k]==="ഉണ്ട്"?"selected":""}>ഉണ്ട്</option><option value="ഇല്ല" ${c[k]==="ഇല്ല"?"selected":""}>ഇല്ല</option></select>`;
    return `<label>${l}</label><input id="e_${k}" type="${t}" value="${esc(c[k]??"")}">`;
  }).join("");
};
$("cancelEditBtn").onclick=()=>{show($("editCard"),false);show($("detailsCard"),true)};
$("updateBtn").onclick=async()=>{
  if(!currentCase)return;
  const patch={};
  ["application_no","applicant_name","applicant_address","age","mobile","damage_location","wild_animal","gun_license","forest_crime_accused","damaged_crops","damage_details","latitude","longitude","witness_names","witness_numbers","officer_name","area","compensation_amount"].forEach(k=>{
    const el=$("e_"+k); if(el) patch[k]=el.value.trim()===""?null:el.value.trim();
  });
  if(patch.application_no && !/^\d{4,}$/.test(patch.application_no)){msg("editMsg","അപേക്ഷ നമ്പർ 4 അക്കമെങ്കിലും വേണം.");return}
  if(!patch.officer_name){msg("editMsg","പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ നിർബന്ധമാണ്.");return}
  if(patch.gun_license==="ഉണ്ട്"||patch.forest_crime_accused==="ഉണ്ട്"){msg("editMsg","ഈ അപേക്ഷ യോഗ്യമല്ല.");return}
  const {error}=await db.from("compensation_cases").update(patch).eq("id",currentCase.id);
  if(error){msg("editMsg",error.message);return}
  Object.assign(currentCase,patch); msg("editMsg","Changes saved.",true);
  await openCase(currentCase.id);
};
window.deleteCase=async function(id){
  if(!(await db.auth.getSession()).data.session){alert("Please login first.");return}
  const c=cases.find(x=>x.id===id);
  if(!confirm("ഈ അപേക്ഷ delete ചെയ്യണോ? ഇത് തിരിച്ചെടുക്കാൻ കഴിയില്ല."))return;
  if(c?.photo_name) await db.storage.from("compensation-photos").remove([c.photo_name]);
  const {error}=await db.from("compensation_cases").delete().eq("id",id);
  if(error){alert("Delete failed: "+error.message);return}
  if(currentCase?.id===id){currentCase=null;show($("detailsCard"),false)}
  await loadCases();
};

async function loadComments(id){
  $("commentsList").textContent="Loading...";
  const {data,error}=await db.from("compensation_comments").select("*").eq("case_id",id).order("created_at",{ascending:false});
  if(error){$("commentsList").textContent="";return}
  $("commentsList").innerHTML=(data||[]).map(c=>`<div class="row"><b>Remark</b><br>${esc(c.comment||c.remarks||"")}<br><small>${esc(c.created_at||"")}</small></div>`).join("")||"<small>No remarks.</small>";
}
$("saveCommentBtn").onclick=async()=>{
  if(!currentCase)return;
  const text=$("comment").value.trim();if(!text)return;
  const {error}=await db.from("compensation_comments").insert({case_id:currentCase.id,comment:text});
  if(error){msg("commentMsg",error.message);return}
  $("comment").value="";msg("commentMsg","Comment saved.",true);loadComments(currentCase.id);
};
init();
</script>
</body>
</html>
