<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compensation - Verification Report</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef5ff,#f4fbf7);font-family:Arial,"Noto Sans Malayalam",sans-serif;color:#14243a}
.wrap{max-width:900px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#123d8d,#16745d);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.head h1{margin:0;font-size:23px}.head p{margin:5px 0 0;opacity:.9}.card{background:#fff;border:1px solid #e3e9f1;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 6px 22px #10233f10}
input,textarea,select{width:100%;padding:11px;border:1px solid #d5deea;border-radius:11px;font-size:15px;margin:5px 0 10px}label{font-weight:700;font-size:13px}
button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer}
.primary{background:#155eef;color:#fff}.green{background:#087f5b;color:#fff}.danger{background:#d92d20;color:#fff}.light{background:#edf2f8;color:#15253b}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{min-width:100px}.hidden{display:none!important}
.item{border:1px solid #e0e7f0;border-radius:14px;padding:12px;margin:9px 0}.itemtop{display:flex;justify-content:space-between;gap:8px}.appno{font-size:17px;font-weight:900}.name{font-size:15px;margin-top:3px}
.small-actions{display:flex;gap:6px;margin-top:9px}.small-actions button{padding:7px 10px;font-size:12px;min-width:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{background:#f7f9fc;border-radius:10px;padding:9px;font-size:14px}.detail b{display:block;color:#667085;font-size:11px;margin-bottom:3px}
.crop{background:#edf6ff;border:1px solid #cfe1fb;border-radius:10px;padding:9px;margin:6px 0}.crop b{color:#174a8b}
.photo{width:100%;max-height:400px;object-fit:contain;border-radius:12px;background:#f0f3f6;margin-top:8px}
.msg{padding:9px;border-radius:9px;margin-top:8px}.ok{background:#eaf8f0;color:#12633f}.err{background:#fff0f1;color:#9f2630}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:9px}.head{padding:15px}.small-actions{gap:5px}.small-actions button{min-width:64px;padding:7px 8px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>📋 Compensation Admin</h1><p>Verification Report</p></div>

<div id="loginCard" class="card">
<h2>🔐 Admin Login</h2>
<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" class="primary">Login</button><div id="loginMsg"></div>
</div>

<div id="app" class="hidden">
<div class="card"><div class="toolbar">
<button id="reportBtn" class="primary">📋 Verification Report</button>
<button id="logoutBtn" class="light">🚪 Logout</button>
</div></div>

<div id="reportCard" class="card hidden">
<h2>📋 Verification Report</h2>
<input id="search" placeholder="🔎 അപേക്ഷ നമ്പർ / അപേക്ഷകന്റെ പേര്">
<div id="list"></div>
</div>

<div id="detailCard" class="card hidden">
<div class="toolbar"><button id="backBtn" class="light">← Back</button><button id="editBtn" class="primary">✏️ Edit</button><button id="deleteBtn" class="danger">🗑️ Delete</button></div>
<hr><h2>Application Details</h2><div id="details"></div><div id="photoBox"></div>
<h3>💬 Remarks</h3><textarea id="comment" rows="3" placeholder="Remarks എഴുതുക"></textarea><button id="commentBtn" class="green">Save Comment</button><div id="commentMsg"></div><div id="comments"></div>
</div>

<div id="editCard" class="card hidden">
<h2>✏️ Edit Application</h2><div id="editForm"></div>
<div class="toolbar"><button id="updateBtn" class="green">Save Changes</button><button id="cancelBtn" class="light">Cancel</button></div><div id="editMsg"></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://jrccmucxwgebdurcokix.supabase.co";
const KEY="sb_publishable_-IbSEjr2Nn_TpO-jRAujUQ_q-kugYET";
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let rows=[],current=null,initialized=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const show=(id,on)=>$(id).classList.toggle("hidden",!on);
function message(id,s,ok=false){$(id).innerHTML=s?'<div class="msg '+(ok?'ok':'err')+'">'+esc(s)+'</div>':''}

function cropHTML(v){
 if(!v)return '<div class="detail"><b>🌾 വിളകളുടെ വിവരങ്ങൾ</b>ലഭ്യമല്ല</div>';
 let arr=String(v).split(",").map(x=>x.trim()).filter(Boolean), h='<div class="detail"><b>🌾 നാശം സംഭവിച്ച വിളകളുടെ വിവരങ്ങൾ</b>';
 arr.forEach(x=>{
   let m=x.match(/^(.+?)\s*[–-]\s*(.+?)\s*[–-]\s*(\d+)\s*എണ്ണം$/);
   h+=m?'<div class="crop"><b>'+esc(m[1])+'</b> — '+esc(m[2])+' — <b>'+esc(m[3])+' എണ്ണം</b></div>':'<div class="crop">'+esc(x)+'</div>';
 });
 return h+'</div>';
}

async function hardLoginGate(){
  // Start every fresh page visit at the login screen.
  // Clear only the local Supabase session; do not block the login flow.
  initialized=false;
  show("loginCard",true);
  show("app",false);
  show("reportCard",false);
  show("detailCard",false);
  show("editCard",false);
  try { await db.auth.signOut({scope:"local"}); } catch(e) {}
  initialized=true;
}
async function login(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email || !password){message("loginMsg","Email, password രണ്ടും നൽകുക.");return}
  $("loginBtn").disabled=true;
  message("loginMsg","Login ചെയ്യുന്നു...",true);
  try{
    const result=await db.auth.signInWithPassword({email,password});
    if(result.error){
      message("loginMsg","❌ Login failed: "+result.error.message);
      return;
    }
    const session = result.data && result.data.session;
    if(!session){
      message("loginMsg","❌ Login session ലഭിച്ചില്ല. Email/password പരിശോധിക്കുക.");
      return;
    }
    // Explicitly store the authenticated session.
    const saved=await db.auth.setSession({
      access_token:session.access_token,
      refresh_token:session.refresh_token
    });
    if(saved.error){
      message("loginMsg","❌ Session save failed: "+saved.error.message);
      return;
    }
    show("loginCard",false);
    show("app",true);
    message("loginMsg","");
  }catch(e){
    message("loginMsg","Login failed: "+(e.message||e));
  }finally{
    $("loginBtn").disabled=false;
  }
}
$("loginBtn").onclick=login;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

db.auth.onAuthStateChange((_event,session)=>{
 if(!initialized)return;
 if(!session){
   show("loginCard",true);show("app",false);show("reportCard",false);show("detailCard",false);show("editCard",false);
 }
});

$("logoutBtn").onclick=async()=>{await db.auth.signOut({scope:"local"});};
$("reportBtn").onclick=async()=>{
 const {data}=await db.auth.getSession(); if(!data.session){await hardLoginGate();return}
 show("reportCard",true);show("detailCard",false);show("editCard",false);await loadRows();
};
async function loadRows(){
 $("list").textContent="Loading...";
 const {data,error}=await db.from("compensation_cases").select("*").order("created_at",{ascending:true});
 if(error){$("list").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
 rows=data||[];render(rows);
}
function render(list){
 if(!list.length){$("list").textContent="No applications found.";return}
 $("list").innerHTML=list.map((r,i)=>`<div class="item">
 <div class="itemtop"><div><div class="appno">${i+1}. ${esc(r.application_no||"Application No. ഇല്ല")}</div><div class="name">${esc(r.applicant_name||"")}</div></div></div>
 <div class="small-actions"><button class="primary" onclick="openCase('${r.id}')">Open</button><button class="light" onclick="editCase('${r.id}')">✏️ Edit</button><button class="danger" onclick="removeCase('${r.id}')">🗑️ Delete</button></div>
 </div>`).join("");
}
$("search").oninput=function(){let q=this.value.toLowerCase().trim();render(rows.filter(r=>String(r.application_no||"").toLowerCase().includes(q)||String(r.applicant_name||"").toLowerCase().includes(q)))};

const labels={application_no:"അപേക്ഷ നമ്പർ",applicant_name:"അപേക്ഷകന്റെ പേര്",applicant_address:"അപേക്ഷകന്റെ വിലാസം",age:"വയസ്സ്",mobile:"മൊബൈൽ നമ്പർ",damage_location:"കൃഷിനാശം സംഭവിച്ച സ്ഥലം",wild_animal:"കൃഷിനാശം വരുത്തിയ വന്യമൃഗം",gun_license:"Gun ലൈസൻസ്",forest_crime_accused:"വന സംബന്ധമായ കുറ്റകൃത്യങ്ങളിൽ പ്രതിയാണോ",damage_details:"കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ",latitude:"GPS Latitude",longitude:"GPS Longitude",witness_names:"സാക്ഷിയുടെ പേര്",witness_numbers:"സാക്ഷിയുടെ നമ്പർ",officer_name:"പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ",area:"വിസ്തീർണ്ണം",compensation_amount:"നഷ്ടപരിഹാര തുക"};

window.openCase=async function(id){
 const {data,error}=await db.from("compensation_cases").select("*").eq("id",id).single();if(error){alert(error.message);return}
 current=data;show("reportCard",false);show("editCard",false);show("detailCard",true);
 let h='<div class="grid">';
 Object.keys(labels).forEach(k=>{if(data[k]!==null&&data[k]!==undefined&&data[k]!=="")h+='<div class="detail"><b>'+labels[k]+'</b>'+esc(data[k])+'</div>'});
 h+=cropHTML(data.damaged_crops)+'</div>'; $("details").innerHTML=h;
 $("photoBox").innerHTML="";
 if(data.photo_name){const {data:p}=await db.storage.from("compensation-photos").createSignedUrl(data.photo_name,3600);if(p?.signedUrl)$("photoBox").innerHTML='<h3>📷 സ്ഥലം ഫോട്ടോ</h3><img class="photo" src="'+esc(p.signedUrl)+'">';}
 await loadComments(id);
};
$("backBtn").onclick=()=>{show("detailCard",false);show("reportCard",true);loadRows()};
$("editBtn").onclick=()=>current&&editCase(current.id);

window.editCase=async function(id){
 const {data,error}=await db.from("compensation_cases").select("*").eq("id",id).single();if(error){alert(error.message);return}
 current=data;show("reportCard",false);show("detailCard",false);show("editCard",true);
 const f=[["application_no","അപേക്ഷ നമ്പർ","text"],["applicant_name","അപേക്ഷകന്റെ പേര്","text"],["applicant_address","അപേക്ഷകന്റെ വിലാസം","textarea"],["age","വയസ്സ്","number"],["mobile","മൊബൈൽ നമ്പർ","text"],["damage_location","കൃഷിനാശം സംഭവിച്ച സ്ഥലം","text"],["wild_animal","വന്യമൃഗം","text"],["gun_license","Gun ലൈസൻസ്","select"],["forest_crime_accused","വന കുറ്റകൃത്യങ്ങളിൽ പ്രതിയാണോ","select"],["damaged_crops","🌾 വിള – അവസ്ഥ – എണ്ണം","textarea"],["damage_details","കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ","textarea"],["latitude","GPS Latitude","text"],["longitude","GPS Longitude","text"],["witness_names","സാക്ഷിയുടെ പേര്","text"],["witness_numbers","സാക്ഷിയുടെ നമ്പർ","text"],["officer_name","പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ","text"],["area","വിസ്തീർണ്ണം","text"],["compensation_amount","നഷ്ടപരിഹാര തുക","number"]];
 $("editForm").innerHTML=f.map(x=>x[2]==="textarea"?'<label>'+x[1]+'</label><textarea id="e_'+x[0]+'" rows="3">'+esc(data[x[0]]||"")+'</textarea>':x[2]==="select"?'<label>'+x[1]+'</label><select id="e_'+x[0]+'"><option value="">തിരഞ്ഞെടുക്കുക</option><option '+(data[x[0]]==="ഉണ്ട്"?"selected":"")+' value="ഉണ്ട്">ഉണ്ട്</option><option '+(data[x[0]]==="ഇല്ല"?"selected":"")+' value="ഇല്ല">ഇല്ല</option></select>':'<label>'+x[1]+'</label><input id="e_'+x[0]+'" type="'+x[2]+'" value="'+esc(data[x[0]]??"")+'">').join("");
};
$("cancelBtn").onclick=()=>{show("editCard",false);show("detailCard",true)};
$("updateBtn").onclick=async()=>{
 if(!current)return;let patch={};
 ["application_no","applicant_name","applicant_address","age","mobile","damage_location","wild_animal","gun_license","forest_crime_accused","damaged_crops","damage_details","latitude","longitude","witness_names","witness_numbers","officer_name","area","compensation_amount"].forEach(k=>{let e=$("e_"+k);if(e)patch[k]=e.value.trim()===""?null:e.value.trim()});
 if(patch.application_no&&!/^\\d{4,}$/.test(patch.application_no)){message("editMsg","അപേക്ഷ നമ്പർ നൽകിയാൽ കുറഞ്ഞത് 4 അക്കങ്ങൾ വേണം.");return}
 if(!patch.officer_name){message("editMsg","പരിശോധിച്ച ഉദ്യോഗസ്ഥൻ നിർബന്ധമാണ്.");return}
 if(patch.gun_license==="ഉണ്ട്"||patch.forest_crime_accused==="ഉണ്ട്"){message("editMsg","ഈ അപേക്ഷ സമർപ്പിക്കാൻ യോഗ്യമല്ല.");return}
 const {error}=await db.from("compensation_cases").update(patch).eq("id",current.id);
 if(error){message("editMsg",error.message);return}
 current={...current,...patch};message("editMsg","Changes saved.",true);await openCase(current.id);
};
window.removeCase=async function(id){
 const {data}=await db.auth.getSession();if(!data.session){await hardLoginGate();return}
 if(!confirm("ഈ അപേക്ഷ delete ചെയ്യണോ? ഇത് തിരിച്ചെടുക്കാൻ കഴിയില്ല."))return;
 const c=rows.find(x=>x.id===id);if(c?.photo_name)await db.storage.from("compensation-photos").remove([c.photo_name]);
 const {error}=await db.from("compensation_cases").delete().eq("id",id);if(error){alert(error.message);return}
 current=null;await loadRows();
};
async function loadComments(id){
 const {data,error}=await db.from("compensation_comments").select("*").eq("case_id",id).order("created_at",{ascending:false});
 if(error){$("comments").innerHTML="";return}
 $("comments").innerHTML=(data||[]).map(c=>'<div class="item"><b>Remark</b><br>'+esc(c.comment||c.remarks||"")+'</div>').join("");
}
$("commentBtn").onclick=async()=>{if(!current)return;let v=$("comment").value.trim();if(!v)return;const {error}=await db.from("compensation_comments").insert({case_id:current.id,comment:v});if(error){message("commentMsg",error.message);return}$("comment").value="";message("commentMsg","Comment saved.",true);loadComments(current.id)};

// Do this LAST: it prevents a remembered Supabase session from exposing data.
hardLoginGate();
</script>
</body>
</html>
