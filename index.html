<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compensation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Malayalam",sans-serif;background:#f4f7f5;color:#183028}
.header{background:#176b45;color:#fff;padding:22px 18px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;font-size:14px;opacity:.9}
.container{max-width:760px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
h2{font-size:19px;margin:0 0 16px;color:#176b45}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #ccd8d2;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#176b45;color:#fff;width:100%;margin-top:8px}.secondary{background:#e8f1ed;color:#176b45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-box{border:2px dashed #b9cbc2;border-radius:10px;padding:15px;text-align:center}
.small{font-size:12px;color:#65756e}.hidden{display:none}
#status{margin-top:12px;padding:10px;border-radius:8px;display:none}
.success{background:#e6f5ec;color:#176b45}.error{background:#fdeaea;color:#9b2020}
.search-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{padding:13px;border:1px solid #d5e0db;border-radius:10px;margin-top:9px;cursor:pointer;background:#fafcfb}
.result:hover{background:#eef7f2}
.result b{color:#176b45}.details{line-height:1.7}
.saved-item{padding:14px;border:1px solid #d5e0db;border-radius:10px;margin-top:10px;background:#fafcfb}
.saved-item .title{font-weight:700;color:#176b45;font-size:16px}
.saved-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.saved-actions button{padding:9px 12px;font-size:14px}
.detail-line{padding:9px 0;border-bottom:1px solid #edf1ef}
.detail-line strong{display:block;color:#176b45;font-size:13px}
.linkbox{word-break:break-all;background:#f2f6f4;padding:10px;border-radius:8px;font-size:13px}.admin-box{margin-top:18px;padding:15px;border:1px solid #d5e0db;border-radius:12px;background:#f8fbf9}.admin-box h3{margin:0 0 10px;color:#176b45;font-size:17px}
@media(max-width:600px){.row,.search-row{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<header class="header">
<h1>COMPENSATION</h1>
<p>കൃഷിനാശ നഷ്ടപരിഹാര അപേക്ഷ</p>
</header>

<main class="container">
<div class="card">
<h2>പുതിയ സംഭവം ചേർക്കുക</h2>
<form id="compensationForm">

<label>അപേക്ഷ നമ്പർ (Application No.) <span style="color:#b00020">*</span></label>
<input id="application_no" type="text" required placeholder="അപേക്ഷ നമ്പർ നൽകുക">

<label>അപേക്ഷകന്റെ പേര് <span style="color:#b00020">*</span></label>
<input id="applicant_name" type="text" required>

<label>അപേക്ഷകന്റെ വിലാസം <span style="color:#b00020">*</span></label>
<textarea id="applicant_address" required></textarea>

<div class="row">
<div><label>വയസ്</label><input id="age" type="number" min="1" max="120"></div>
<div><label>മൊബൈൽ നമ്പർ <span style="color:#b00020">*</span></label><input id="mobile" type="tel" required></div>
</div>

<label>കൃഷിനാശം സംഭവിച്ച സ്ഥലം <span style="color:#b00020">*</span></label>
<input id="damage_location" type="text" required>

<label>കൃഷിനാശം വരുത്തിയ വന്യമൃഗത്തിന്റെ പേര് <span style="color:#b00020">*</span></label>
<input id="wild_animal" type="text" required>

<label>കൃഷിനാശം സംഭവിച്ച വിളകളുടെ പേര് <span style="color:#b00020">*</span></label>
<input id="damaged_crops" type="text" required placeholder="ഉദാ: തെങ്ങ്, വാഴ, കപ്പ">

<label>കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ</label>
<textarea id="damage_details"></textarea>

<label>സ്ഥലത്തിന്റെ GPS</label>
<div class="row">
<input id="latitude" type="text" placeholder="Latitude" readonly>
<input id="longitude" type="text" placeholder="Longitude" readonly>
</div>
<button type="button" class="secondary" id="gpsBtn">📍 GPS Location എടുക്കുക</button>

<label>സ്ഥലത്തിന്റെ ഫോട്ടോ</label>
<div class="photo-box">
<input id="photo" type="file" accept="image/*" capture="environment">
<div class="small">ഫോട്ടോ എടുക്കുകയോ തിരഞ്ഞെടുക്കുകയോ ചെയ്യാം</div>
</div>

<label>സാക്ഷികളുടെ പേര്</label><input id="witness_names" type="text">
<label>സാക്ഷികളുടെ മൊബൈൽ നമ്പർ</label><input id="witness_numbers" type="tel">
<label>അപേക്ഷകന്റെ ബാങ്കിന്റെ പേര്</label><input id="bank_name" type="text">
<label>ബാങ്ക് അക്കൗണ്ട് നമ്പർ</label><input id="account_number" type="text">
<label>IFSC Code</label><input id="ifsc_code" type="text">
<label>പരിശോധന നടത്തിയ ഉദ്യോഗസ്ഥന്റെ പേര്</label><input id="officer_name" type="text">
<label>സ്ഥലത്തിന്റെ ഏകദേശം വിസ്തീർണ്ണം</label><input id="area" type="text" placeholder="ഉദാ: 0.50 ഏക്കർ">
<label>ഏകദേശ നഷ്ടപരിഹാര തുക</label><input id="compensation_amount" type="number" min="0" step="0.01" placeholder="₹">

<button class="primary" type="submit">💾 SAVE</button>
<div id="status"></div>
</form>
</div>

<div class="card" id="savedDataCard">
<h2>💾 Saved Data</h2>
<div id="savedDataList">
  <p class="small">ഇവിടെ save ചെയ്ത അപേക്ഷകൾ കാണിക്കും.</p>
</div>
</div>

<div class="card">
<h2>🔎 അപേക്ഷ തിരയുക</h2>
<div class="search-row">
<div><label>അപേക്ഷ നമ്പർ</label><input id="searchNo" type="text" placeholder="Application No."></div>
<div><label>അപേക്ഷകന്റെ പേര്</label><input id="searchName" type="text" placeholder="പേര്"></div>
</div>
<button class="primary" type="button" id="searchBtn">SEARCH</button>
<div id="results"></div>
</div>

<div class="card hidden" id="detailsCard">
<h2>📋 Administration Details</h2>
<div id="details" class="details"></div>

<div class="admin-box">
  <h3>💬 Comment / Remarks</h3>
  <textarea id="adminRemarks" placeholder="ഇവിടെ Comment / Remarks എഴുതുക..."></textarea>
  <button class="primary" type="button" id="saveRemarksBtn">💾 SAVE COMMENT</button>
  <div id="remarksStatus" class="small" style="margin-top:8px"></div>
</div>

<button class="secondary" type="button" id="backBtn" style="margin-top:14px">← Search-ലേക്ക് മടങ്ങുക</button>
</div>
</main>

<script>
const KEY="compensation_cases_v1";

function getCases(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function saveCases(cases){localStorage.setItem(KEY,JSON.stringify(cases))}

function val(id){return document.getElementById(id).value.trim()}


async function loadSavedData(){
 const list=document.getElementById("savedDataList");
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/compensation_cases?select=*&order=created_at.desc",{
   headers:{
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY
   }
  });
  if(!response.ok) throw new Error(await response.text());
  const rows=await response.json();

  if(!rows.length){
   list.innerHTML='<p class="small">ഇതുവരെ ഒരു അപേക്ഷയും save ചെയ്തിട്ടില്ല.</p>';
   return;
  }

  list.innerHTML="";
  rows.forEach(x=>{
   const div=document.createElement("div");
   div.className="saved-item";
   div.innerHTML=`
    <div class="title">${escapeHtml(x.application_no||"-")}</div>
    <div>${escapeHtml(x.applicant_name||"-")}</div>
    <div class="small">${escapeHtml(x.wild_animal||"-")} • ${escapeHtml(x.damaged_crops||"-")}</div>
    <div class="saved-actions">
      <button type="button" class="secondary viewSaved">👁 View</button>
      <button type="button" class="secondary editSaved">✏️ Edit</button>
    </div>`;
   div.querySelector(".viewSaved").onclick=()=>showDetails(x);
   div.querySelector(".editSaved").onclick=()=>editCase(x);
   list.appendChild(div);
  });
 }catch(err){
  list.innerHTML='<p class="small">Saved data load ചെയ്യാൻ കഴിഞ്ഞില്ല. Supabase table/RLS പരിശോധിക്കുക.</p>';
  console.error(err);
 }
}

function editCase(x){
 const fields=[
  "application_no","applicant_name","applicant_address","age","mobile",
  "damage_location","wild_animal","damaged_crops","damage_details",
  "latitude","longitude","witness_names","witness_numbers","bank_name",
  "account_number","ifsc_code","officer_name","area","compensation_amount","admin_remarks"
 ];
 fields.forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.value=x[id] ?? "";
 });
 document.getElementById("savedDataCard").scrollIntoView({behavior:"smooth"});
 document.getElementById("compensationForm").dataset.editId=x.id;
 const btn=document.querySelector('#compensationForm button[type="submit"]');
 btn.textContent="✏️ UPDATE";
}

document.getElementById("gpsBtn").addEventListener("click",()=>{
 if(!navigator.geolocation){alert("ഈ browser GPS support ചെയ്യുന്നില്ല.");return}
 navigator.geolocation.getCurrentPosition(pos=>{
  document.getElementById("latitude").value=pos.coords.latitude.toFixed(6);
  document.getElementById("longitude").value=pos.coords.longitude.toFixed(6);
 },()=>alert("GPS ലഭിച്ചില്ല. Location permission അനുവദിക്കുക."));
});

document.getElementById("compensationForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const status=document.getElementById("status");
 status.style.display="block";

 const no=val("application_no");
 const editId=e.target.dataset.editId||"";
 const photo=document.getElementById("photo").files[0];

 const data={
  application_no:no,
  applicant_name:val("applicant_name"),
  applicant_address:val("applicant_address"),
  age:val("age")||null,
  mobile:val("mobile"),
  damage_location:val("damage_location"),
  wild_animal:val("wild_animal"),
  damaged_crops:val("damaged_crops"),
  damage_details:val("damage_details"),
  latitude:val("latitude")||null,
  longitude:val("longitude")||null,
  photo_name:photo?photo.name:"",
  witness_names:val("witness_names"),
  witness_numbers:val("witness_numbers"),
  bank_name:val("bank_name"),
  account_number:val("account_number"),
  ifsc_code:val("ifsc_code"),
  officer_name:val("officer_name"),
  area:val("area"),
  compensation_amount:val("compensation_amount")||null,
  admin_remarks:val("adminRemarks")||null
 };

 try{
  let url=SUPABASE_URL+"/rest/v1/compensation_cases";
  let method="POST";
  if(editId){
   url += "?id=eq."+encodeURIComponent(editId);
   method="PATCH";
  }
  const response=await fetch(url,{
   method,
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY,
    "Prefer":"return=representation"
   },
   body:JSON.stringify(data)
  });
  const text=await response.text();
  if(!response.ok) throw new Error(text||"Save failed");

  status.className="success";
  status.innerHTML=editId
   ? `<b>Updated successfully!</b><br>Application No.: ${escapeHtml(no)}`
   : `<b>Saved successfully!</b><br>Application No.: ${escapeHtml(no)}`;

  delete e.target.dataset.editId;
  e.target.reset();
  document.getElementById("latitude").value="";
  document.getElementById("longitude").value="";
  document.getElementById("adminRemarks").value="";
  document.querySelector('#compensationForm button[type="submit"]').textContent="💾 SAVE";

  await loadSavedData();
  document.getElementById("savedDataCard").scrollIntoView({behavior:"smooth"});
 }catch(err){
  status.className="error";
  let msg=String(err.message||err);
  if(msg.includes("duplicate key")||msg.includes("compensation_cases_application_no_key"))
    msg="ഈ അപേക്ഷ നമ്പർ ഇതിനകം save ചെയ്തിട്ടുണ്ട്. വേറെ Application No. നൽകുക.";
  else if(msg.includes("relation")&&msg.includes("does not exist"))
    msg="Supabase-ൽ compensation_cases table ഇല്ല. SQL setup വീണ്ടും Run ചെയ്യണം.";
  else if(msg.includes("row-level security")||msg.includes("RLS"))
    msg="Supabase RLS policy പ്രശ്നമാണ്. SQL setup വീണ്ടും Run ചെയ്യണം.";
  else msg="Save ചെയ്യാൻ കഴിഞ്ഞില്ല: "+msg;
  status.innerText=msg;
  console.error(err);
});
document.getElementById("searchBtn").addEventListener("click",async()=>{
 const no=val("searchNo"), name=val("searchName");
 const results=document.getElementById("results");
 results.innerHTML="";
 if(!no&&!name){results.innerHTML='<p class="small">അപേക്ഷ നമ്പറോ പേരോ നൽകുക.</p>';return}

 let params=[];
 if(no) params.push("application_no=ilike.*"+encodeURIComponent(no)+"*");
 if(name) params.push("applicant_name=ilike.*"+encodeURIComponent(name)+"*");

 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/compensation_cases?select=*&"+params.join("&")+"&order=created_at.desc",{
   headers:{
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY
   }
  });
  if(!response.ok) throw new Error(await response.text());
  const found=await response.json();
  if(!found.length){results.innerHTML='<p class="small">അപേക്ഷ കണ്ടെത്തിയില്ല.</p>';return}

  found.forEach(x=>{
   const div=document.createElement("div");div.className="result";
   div.innerHTML=`<b>${escapeHtml(x.application_no)}</b> — ${escapeHtml(x.applicant_name)}`;
   div.onclick=()=>showDetails(x);
   results.appendChild(div);
  });
 }catch(err){
  results.innerHTML='<p class="small">Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Supabase table/RLS setup പരിശോധിക്കുക.</p>';
  console.error(err);
 }
});
function showDetails(x){
 if(!x)return;
 const fields=[
 ["അപേക്ഷ നമ്പർ",x.application_no],["അപേക്ഷകന്റെ പേര്",x.applicant_name],
 ["അപേക്ഷകന്റെ വിലാസം",x.applicant_address],["വയസ്",x.age],["മൊബൈൽ നമ്പർ",x.mobile],
 ["കൃഷിനാശം സംഭവിച്ച സ്ഥലം",x.damage_location],["കൃഷിനാശം വരുത്തിയ വന്യമൃഗത്തിന്റെ പേര്",x.wild_animal],
 ["കൃഷിനാശം സംഭവിച്ച വിളകളുടെ പേര്",x.damaged_crops],["കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ",x.damage_details],
 ["GPS",x.latitude&&x.longitude?x.latitude+", "+x.longitude:""],
 ["ഫോട്ടോ",x.photo_name],["സാക്ഷികളുടെ പേര്",x.witness_names],
 ["സാക്ഷികളുടെ മൊബൈൽ നമ്പർ",x.witness_numbers],["ബാങ്കിന്റെ പേര്",x.bank_name],
 ["ബാങ്ക് അക്കൗണ്ട് നമ്പർ",x.account_number],["IFSC Code",x.ifsc_code],
 ["പരിശോധന നടത്തിയ ഉദ്യോഗസ്ഥന്റെ പേര്",x.officer_name],["സ്ഥലത്തിന്റെ ഏകദേശം വിസ്തീർണ്ണം",x.area],
 ["ഏകദേശ നഷ്ടപരിഹാര തുക",x.compensation_amount]
 ];
 document.getElementById("details").innerHTML=fields.map(f=>
  `<div class="detail-line"><strong>${escapeHtml(f[0])}</strong>${escapeHtml(f[1]||"-")}</div>`).join("");
 document.getElementById("adminRemarks").value=x.admin_remarks||"";
 document.getElementById("saveRemarksBtn").dataset.caseId=x.id||"";
 document.getElementById("remarksStatus").textContent="";
 document.getElementById("detailsCard").classList.remove("hidden");
 document.getElementById("detailsCard").scrollIntoView({behavior:"smooth"});
}
document.getElementById("saveRemarksBtn").onclick=async()=>{
 const id=document.getElementById("saveRemarksBtn").dataset.caseId;
 const remarks=document.getElementById("adminRemarks").value.trim();
 const out=document.getElementById("remarksStatus");
 if(!id){out.textContent="Application തിരഞ്ഞെടുക്കുക.";return}
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/compensation_cases?id=eq."+encodeURIComponent(id),{
   method:"PATCH",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Prefer":"return=minimal"},
   body:JSON.stringify({admin_remarks:remarks})
  });
  if(!response.ok) throw new Error(await response.text());
  out.textContent="Comment / Remarks saved successfully.";
  await loadSavedData();
 }catch(err){out.textContent="Comment save ചെയ്യാൻ കഴിഞ്ഞില്ല. Supabase UPDATE policy പരിശോധിക്കുക.";console.error(err)}
};

document.getElementById("backBtn").onclick=()=>document.getElementById("detailsCard").classList.add("hidden");

loadSavedData();

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
