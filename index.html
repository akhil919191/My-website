<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compensation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Malayalam",sans-serif;background:#f4f7f5;color:#183028}
.header{background:#176b45;color:#fff;padding:22px 18px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;font-size:14px;opacity:.9}
.container{max-width:760px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
h2{font-size:19px;margin:0 0 16px;color:#176b45}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #ccd8d2;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#176b45;color:#fff;width:100%;margin-top:8px}.secondary{background:#e8f1ed;color:#176b45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-box{border:2px dashed #b9cbc2;border-radius:10px;padding:15px;text-align:center}
.small{font-size:12px;color:#65756e}.hidden{display:none}
#status{margin-top:12px;padding:10px;border-radius:8px;display:none}
.success{background:#e6f5ec;color:#176b45}.error{background:#fdeaea;color:#9b2020}
.search-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{padding:13px;border:1px solid #d5e0db;border-radius:10px;margin-top:9px;cursor:pointer;background:#fafcfb}
.result:hover{background:#eef7f2}
.result b{color:#176b45}.details{line-height:1.7}
.saved-item{padding:14px;border:1px solid #d5e0db;border-radius:10px;margin-top:10px;background:#fafcfb}
.saved-item .title{font-weight:700;color:#176b45;font-size:16px}
.saved-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.saved-actions button{padding:9px 12px;font-size:14px}
.detail-line{padding:9px 0;border-bottom:1px solid #edf1ef}
.detail-line strong{display:block;color:#176b45;font-size:13px}
.linkbox{word-break:break-all;background:#f2f6f4;padding:10px;border-radius:8px;font-size:13px}.admin-box{margin-top:18px;padding:15px;border:1px solid #d5e0db;border-radius:12px;background:#f8fbf9}.admin-box h3{margin:0 0 10px;color:#176b45;font-size:17px}
@media(max-width:600px){.row,.search-row{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<header class="header">
<h1>COMPENSATION</h1>
<p>കൃഷിനാശ നഷ്ടപരിഹാര അപേക്ഷ</p>
</header>

<main class="container">
<div class="card">
<h2>പുതിയ സംഭവം ചേർക്കുക</h2>
<form id="compensationForm">

<label>അപേക്ഷ നമ്പർ (Application No.) <span style="color:#b00020">*</span></label>
<input id="application_no" type="text" required placeholder="അപേക്ഷ നമ്പർ നൽകുക">
<div id="applicationNoStatus" class="small" style="margin-top:7px;min-height:18px"></div>

<label>അപേക്ഷകന്റെ പേര് <span style="color:#b00020">*</span></label>
<input id="applicant_name" type="text" required>

<label>അപേക്ഷകന്റെ വിലാസം <span style="color:#b00020">*</span></label>
<textarea id="applicant_address" required></textarea>

<div class="row">
<div><label>വയസ്</label><input id="age" type="number" min="1" max="120"></div>
<div><label>മൊബൈൽ നമ്പർ <span style="color:#b00020">*</span></label><input id="mobile" type="tel" required></div>
</div>

<label>കൃഷിനാശം സംഭവിച്ച സ്ഥലം <span style="color:#b00020">*</span></label>
<input id="damage_location" type="text" required>

<label>കൃഷിനാശം വരുത്തിയ വന്യമൃഗത്തിന്റെ പേര് <span style="color:#b00020">*</span></label>
<input id="wild_animal" type="text" required>

<label>കൃഷിനാശം സംഭവിച്ച വിളകളുടെ പേര് <span style="color:#b00020">*</span></label>
<input id="damaged_crops" type="text" required placeholder="ഉദാ: തെങ്ങ്, വാഴ, കപ്പ">

<label>കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ</label>
<textarea id="damage_details"></textarea>

<label>സ്ഥലത്തിന്റെ GPS</label>
<div class="row">
<input id="latitude" type="text" placeholder="Latitude" readonly>
<input id="longitude" type="text" placeholder="Longitude" readonly>
</div>
<button type="button" class="secondary" id="gpsBtn">📍 GPS Location എടുക്കുക</button>
<div id="gpsStatus" class="small" style="margin-top:8px"></div>

<label>സ്ഥലത്തിന്റെ ഫോട്ടോ</label>
<div class="photo-box">
<input id="photo" type="file" accept="image/*">
<div id="photoPreview" style="margin-top:10px;display:none">
  <img id="photoPreviewImg" alt="Selected photo" style="width:100%;max-width:420px;border-radius:12px;display:block">
</div>
<div class="small">ഫോട്ടോ എടുക്കുകയോ തിരഞ്ഞെടുക്കുകയോ ചെയ്യാം</div>
</div>

<label>സാക്ഷിയുടെ പേര്</label><input id="witness_names" type="text">
<label>സാക്ഷിയുടെ നമ്പർ</label><input id="witness_numbers" type="tel">
<label>പരിശോധന ഉദ്യോഗസ്ഥൻ</label><input id="officer_name" type="text">
<label>വിസ്തീർണ്ണം</label><input id="area" type="text" placeholder="ഉദാ: 0.50 ഏക്കർ">
<label>നഷ്ടപരിഹാര തുക</label><input id="compensation_amount" type="number" min="0" step="0.01" placeholder="₹">

<button class="primary" type="submit">💾 SAVE</button>
<div id="status"></div>
</form>
</div>


</main>

<script>
const SUPABASE_URL = "https://jrccmucxwgebdurcokix.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-IbSEjr2Nn_TpO-jRAujUQ_q-kugYET";

const form = document.getElementById("compensationForm");
const statusBox = document.getElementById("status");

function val(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}


let applicationNoExists = false;
let applicationNoTimer = null;

async function checkApplicationNumber() {
  const field = document.getElementById("application_no");
  const box = document.getElementById("applicationNoStatus");
  const no = field.value.trim();

  applicationNoExists = false;
  box.textContent = "";

  if (!no) return;

  box.textContent = "Checking...";
  clearTimeout(applicationNoTimer);

  applicationNoTimer = setTimeout(async () => {
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/check_application_no", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_application_no: no })
      });

      if (!res.ok) {
        box.textContent = "";
        return;
      }

      const exists = await res.json();
      applicationNoExists = exists === true;

      if (applicationNoExists) {
        box.innerHTML = '⚠️ <strong style="color:#9b2020">ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong> വേറെ നമ്പർ നൽകുക.';
      } else {
        box.innerHTML = '✅ <span style="color:#176b45">അപേക്ഷ നമ്പർ ലഭ്യമാണ്.</span>';
      }
    } catch (err) {
      box.textContent = "";
    }
  }, 250);
}

document.getElementById("application_no").addEventListener("blur", checkApplicationNumber);
document.getElementById("application_no").addEventListener("change", checkApplicationNumber);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  statusBox.style.display = "block";
  statusBox.className = "";
  statusBox.textContent = "Saving...";

  await checkApplicationNumber();
  if (applicationNoExists) {
    statusBox.className = "error";
    statusBox.innerHTML = "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>വേറെ അപേക്ഷ നമ്പർ നൽകുക.";
    return;
  }

  const data = {
    application_no: val("application_no"),
    applicant_name: val("applicant_name"),
    applicant_address: val("applicant_address"),
    age: val("age") ? Number(val("age")) : null,
    mobile: val("mobile"),
    damage_location: val("damage_location"),
    wild_animal: val("wild_animal"),
    damaged_crops: val("damaged_crops"),
    damage_details: val("damage_details"),
    latitude: val("latitude"),
    longitude: val("longitude"),
    photo_name: val("photo"),
    witness_names: val("witness_names"),
    witness_numbers: val("witness_numbers"),
    officer_name: val("officer_name"),
    area: val("area"),
    compensation_amount: val("compensation_amount") ? Number(val("compensation_amount")) : null
  };

  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/compensation_cases", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      const errorText = await response.text();

      // Duplicate application number
      if (response.status === 409 || errorText.includes("23505") || errorText.toLowerCase().includes("duplicate")) {
        statusBox.className = "error";
        statusBox.style.display = "block";
        statusBox.innerHTML =
          "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>" +
          "വേറെ അപേക്ഷ നമ്പർ നൽകുക." +
          '<br><button type="button" id="changeApplicationNo" style="margin-top:10px;padding:9px 14px;border:0;border-radius:8px;background:#176b4d;color:white;font-weight:700;">അപേക്ഷ നമ്പർ മാറ്റുക</button>';

        document.getElementById("changeApplicationNo").onclick = () => {
          const field = document.getElementById("application_no");
          field.focus();
          field.select();
        };
        return;
      }

      throw new Error(errorText);
    }

    statusBox.className = "success";
    statusBox.style.display = "block";
    statusBox.textContent = "✅ Saved successfully!";
    form.reset();
  } catch (error) {
    console.error(error);
    statusBox.className = "error";
    statusBox.style.display = "block";
    statusBox.innerHTML =
      "❌ <strong>Save failed.</strong><br>" +
      "കാരണം: " + (error.message || "Unknown error");
  }
});

document.getElementById("gpsBtn")?.addEventListener("click", () => {
  const status = document.getElementById("gpsStatus");
  if (!navigator.geolocation) {
    status.textContent = "GPS not supported.";
    return;
  }
  status.textContent = "Getting location...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById("latitude").value = pos.coords.latitude.toFixed(6);
      document.getElementById("longitude").value = pos.coords.longitude.toFixed(6);
      status.textContent = "✅ GPS captured.";
    },
    () => { status.textContent = "❌ GPS permission/location unavailable."; }
  );
});
</script>

<script>
(function(){
  const input=document.getElementById("photo");
  const box=document.getElementById("photoPreview");
  const img=document.getElementById("photoPreviewImg");
  if(!input || !box || !img) return;
  input.addEventListener("change", function(){
    const file=this.files && this.files[0];
    if(!file){ box.style.display="none"; img.removeAttribute("src"); return; }
    const url=URL.createObjectURL(file);
    img.src=url;
    box.style.display="block";
  });
})();
</script>
</body>
</html>
