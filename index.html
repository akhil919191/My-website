<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compensation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Malayalam",sans-serif;background:#f4f7f5;color:#183028}
.header{background:#176b45;color:#fff;padding:22px 18px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;font-size:14px;opacity:.9}
.container{max-width:760px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
h2{font-size:19px;margin:0 0 16px;color:#176b45}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #ccd8d2;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#176b45;color:#fff;width:100%;margin-top:8px}.secondary{background:#e8f1ed;color:#176b45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{font-size:12px;color:#65756e}.hidden{display:none}
#status{margin-top:12px;padding:10px;border-radius:8px;display:none}
.success{background:#e6f5ec;color:#176b45}.error{background:#fdeaea;color:#9b2020}
.search-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{padding:13px;border:1px solid #d5e0db;border-radius:10px;margin-top:9px;cursor:pointer;background:#fafcfb}
.result:hover{background:#eef7f2}
.result b{color:#176b45}.details{line-height:1.7}
.saved-item{padding:14px;border:1px solid #d5e0db;border-radius:10px;margin-top:10px;background:#fafcfb}
.saved-item .title{font-weight:700;color:#176b45;font-size:16px}
.saved-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.saved-actions button{padding:9px 12px;font-size:14px}
.detail-line{padding:9px 0;border-bottom:1px solid #edf1ef}
.detail-line strong{display:block;color:#176b45;font-size:13px}
.linkbox{word-break:break-all;background:#f2f6f4;padding:10px;border-radius:8px;font-size:13px}.admin-box{margin-top:18px;padding:15px;border:1px solid #d5e0db;border-radius:12px;background:#f8fbf9}.admin-box h3{margin:0 0 10px;color:#176b45;font-size:17px}
@media(max-width:600px){.row,.search-row{grid-template-columns:1fr}.card{padding:16px}}
</style>
<style id="crop-row-style">.crop-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid #d5e0db;border-radius:10px;background:#f8fbf9}.crop-row button{padding:5px 10px;background:#fdeaea;color:#9b2020;border:0;border-radius:8px;font-size:18px}.crop-info{flex:1}.crop-amount{font-weight:700;margin-top:4px}.crop-total{margin-top:10px;padding:12px;border-radius:10px;background:#eef7f1;border:1px solid #b9d9c5;font-size:17px;font-weight:700}</style>
</head>

<body>
<header class="header">
<h1>COMPENSATION</h1>
<p>കൃഷിനാശ നഷ്ടപരിഹാര അപേക്ഷ</p>
</header>
<main class="container">
<div class="card">
<h2>അപേക്ഷകന്റെ വിവരങ്ങൾ</h2>

<form id="compensationForm">

<label for="application_no">1. അപേക്ഷ നമ്പർ</label>
<input id="application_no" name="application_no" type="text" inputmode="numeric" minlength="4" pattern="[0-9]{4,}" placeholder="നൽകുന്നെങ്കിൽ കുറഞ്ഞത് 4 അക്കങ്ങൾ">
<div id="applicationNoStatus" class="small" style="margin-top:6px"></div>

<label for="applicant_name">2. അപേക്ഷകന്റെ പേര് <span class="required">*</span></label>
<input id="applicant_name" name="applicant_name" type="text" required>

<label for="applicant_address">3. അപേക്ഷകന്റെ വിലാസം <span class="required">*</span></label>
<textarea id="applicant_address" name="applicant_address" required></textarea>

<div class="row">
<div>
<label for="age">4. വയസ്സ്</label>
<input id="age" name="age" type="number" min="0" max="120" inputmode="numeric">
<label for="inspection_date">സ്ഥലം പരിശോധിച്ച തീയതി</label>
<input id="inspection_date" name="inspection_date" type="date">
</div>
<div>
<label for="mobile">5. മൊബൈൽ നമ്പർ</label>
<input id="mobile" name="mobile" type="tel" inputmode="tel" placeholder="നിർബന്ധമല്ല">
</div>
</div>

<label for="damage_location">6. കൃഷിനാശം സംഭവിച്ച സ്ഥലം <span class="required">*</span></label>
<textarea id="damage_location" name="damage_location" required></textarea>

<label for="wild_animal">7. കൃഷിനാശം വരുത്തിയ വന്യമൃഗത്തിന്റെ പേര് <span class="required">*</span></label>
<input id="wild_animal" name="wild_animal" type="text" required placeholder="ഉദാ: കാട്ടുപന്നി">

<label>8. Gun ലൈസൻസ് ഉണ്ടോ?</label>
<div style="display:flex;gap:18px;flex-wrap:wrap">
<label style="font-weight:500"><input type="radio" name="gun_license" value="ഉണ്ട്"> ഉണ്ട്</label>
<label style="font-weight:500"><input type="radio" name="gun_license" value="ഇല്ല"> ഇല്ല</label>
</div>

<label>9. വന കുറ്റകൃത്യങ്ങളിൽ പ്രതിയാണോ?</label>
<div style="display:flex;gap:18px;flex-wrap:wrap">
<label style="font-weight:500"><input type="radio" name="forest_crime_accused" value="ഉണ്ട്"> ഉണ്ട്</label>
<label style="font-weight:500"><input type="radio" name="forest_crime_accused" value="ഇല്ല"> ഇല്ല</label>
</div>

<div class="crop-section">
<label for="cropSelect">10. നാശം സംഭവിച്ച വിളകൾ <span class="required">*</span></label>
<select id="cropSelect">
<option value="">വിള തിരഞ്ഞെടുക്കുക</option>
<option>തെങ്ങ്</option><option>കവുങ്ങ്</option><option>കാപ്പി</option><option>കുരുമുളക്</option>
<option>ഏത്തവാഴ</option><option>കൊക്കോ</option><option>വെജിറ്റബിൾ</option><option>ഇഞ്ചി</option><option>മരച്ചീനി</option>
<option>കശുവണ്ടി</option><option>വാഴ</option><option>നെല്ല്</option><option>റബ്ബർ</option>
<option>മാവ്</option><option>പ്ലാവ്</option><option>മറ്റുള്ളവ</option>
</select>
<select id="cropStage" style="margin-top:8px">
<option value="">അവസ്ഥ തിരഞ്ഞെടുക്കുക</option>
<option>കായ്ച്ചത്</option><option>കായ്ക്കാത്തത്</option>
<option>കുലച്ചത്</option><option>കുലയ്ക്കാത്തത്</option>
<option>പഴുത്തത്</option><option>പഴുക്കാത്തത്</option>
<option>വളർച്ചയിൽ</option><option>പൂവിട്ടത്</option><option>തൈ/ചെടി</option>
</select>
<div class="small" style="margin-top:5px">കായ്ച്ചത് / കായ്ക്കാത്തത്, കുലച്ചത് / കുലയ്ക്കാത്തത്, പഴുത്തത് / പഴുക്കാത്തത് എന്നിവയ്ക്ക് ബാധകമായ rate സ്വയം എടുക്കും.</div>
<input id="cropCountInput" type="number" min="1" step="1" inputmode="numeric" placeholder="എണ്ണം (ഉദാ: 4)" style="margin-top:8px">
<button type="button" id="addCropBtn" style="margin-top:8px">＋ വിള ചേർക്കുക</button>
    <button type="button" id="saveCropBtn" class="secondary" style="margin-top:8px;width:100%">💾 വിളകളുടെ വിവരം Save</button>
    <div id="cropSaveStatus" class="small" style="margin-top:8px"></div>
<div id="cropTags" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
<input id="cropAdditional" type="text" placeholder="Additional crop/type ഇവിടെ ടൈപ്പ് ചെയ്യാം" style="margin-top:8px">
<input type="hidden" id="damagedCropsHidden" name="damaged_crops">
</div>

<label for="damage_details">12. കൃഷിനാശത്തിന്റെ വിശദാംശങ്ങൾ</label>
<textarea id="damage_details" name="damage_details"></textarea>

<div class="row">
<div>
<label for="latitude">GPS Latitude</label>
<input id="latitude" name="latitude" type="text" readonly>
</div>
<div>
<label for="longitude">GPS Longitude</label>
<input id="longitude" name="longitude" type="text" readonly>
</div>
</div>
<button type="button" class="secondary" id="gpsBtn">📍 GPS Location എടുക്കുക</button>
<div id="gpsStatus" class="small" style="margin-top:8px"></div>

<label for="witness_names">സാക്ഷിയുടെ പേര്</label>
<input id="witness_names" name="witness_names" type="text">
<label for="witness_numbers">സാക്ഷിയുടെ നമ്പർ</label>
<input id="witness_numbers" name="witness_numbers" type="tel">

<label for="officer_name">പരിശോധിച്ച ഉദ്യോഗസ്ഥന്റെ പേര് <span class="required">*</span></label>
<input id="officer_name" name="officer_name" type="text" required>

<label for="area">വിസ്തീർണ്ണം</label>
<input id="area" name="area" type="text" placeholder="ഉദാ: 0.50 ഏക്കർ">

<label for="compensation_amount">നഷ്ടപരിഹാര തുക</label>
<input id="compensation_amount" name="compensation_amount" type="number" min="0" step="0.01" placeholder="₹" readonly>
<div class="small">വിളകളുടെ എണ്ണം നൽകിയാൽ നഷ്ടപരിഹാര തുക സ്വയം കണക്കാക്കും.</div>

<button class="primary" type="submit">💾 SAVE</button>
<div id="status"></div>
</form>
</div>
</main>
<script id="crop-selector-script">
document.addEventListener("DOMContentLoaded", function(){
  const select=document.getElementById("cropSelect"), stage=document.getElementById("cropStage"), count=document.getElementById("cropCountInput");
  const add=document.getElementById("addCropBtn"), tags=document.getElementById("cropTags"), extra=document.getElementById("cropAdditional"), hidden=document.getElementById("damagedCropsHidden");
  const amountField=document.getElementById("compensation_amount");
  if(!select||!stage||!count||!add||!tags||!hidden) return;
  const crops=[];
  window.selectedCompensationCrops=crops;

  // Rates transcribed from the supplied compensation-rate sheet.
  // Where the sheet gives separate bearing/non-bearing rates, the stage controls the rate.
  const rates={
    "നെല്ല്":11000, "കാപ്പി":110, "കുരുമുളക്":83, "ഇഞ്ചി":165, "മഞ്ഞൾ":132,
    "മരച്ചീനി":165, "വെജിറ്റബിൾ":220, "മാവ്":220, "പ്ലാവ്":220,
    "ഏത്തവാഴ":110, "തേങ്ങ":770, "കശുവണ്ടി":165, "കവുങ്ങ്":165,
    "കൊക്കോ":110, "റബ്ബർ":220, "വാഴ":110, "നെല്ല്":11000,
    "കടുക്":0
  };

  function getRate(crop, stage){
    // Bearing stages use the bearing rate; their opposite stages use the non-bearing rate.
    const bearing = stage==="കായ്ച്ചത്" || stage==="കുലച്ചത്" || stage==="പഴുത്തത്";
    const nonBearing = stage==="കായ്ക്കാത്തത്" || stage==="കുലയ്ക്കാത്തത്" || stage==="പഴുക്കാത്തത്" || stage==="തൈ/ചെടി" || stage==="വളർച്ചയിൽ";

    if(crop==="തെങ്ങ്"){
      if(nonBearing) return stage==="തൈ/ചെടി" || stage==="വളർച്ചയിൽ" ? 110 : 385;
      if(bearing) return 770;
    }
    if(crop==="വാഴ" || crop==="ഏത്തവാഴ"){
      if(nonBearing) return 83;
      if(bearing) return 110;
    }
    if(crop==="റബ്ബർ"){
      if(nonBearing) return 220;
      if(bearing) return 280;
    }
    if(crop==="കശുവണ്ടി" || crop==="കവുങ്ങ്"){
      if(nonBearing) return 110;
      if(bearing) return 165;
    }
    if(crop==="കൊക്കോ"){
      if(nonBearing) return 100;
      if(bearing) return 110;
    }
    if(crop==="കാപ്പി"){
      if(nonBearing) return 100;
      if(bearing) return 110;
    }
    if(crop==="കുരുമുളക്"){
      if(nonBearing) return 75;
      if(bearing) return 83;
    }
    if(crop==="ഇഞ്ചി"){
      if(bearing || nonBearing) return bearing ? 165 : 150;
    }
    if(crop==="മരച്ചീനി"){
      if(bearing || nonBearing) return bearing ? 165 : 150;
    }
    if(crop==="വെജിറ്റബിൾ"){
      if(bearing || nonBearing) return bearing ? 220 : 200;
    }
    if(crop==="മാവ്" || crop==="പ്ലാവ്"){
      if(bearing || nonBearing) return bearing ? 220 : 200;
    }
    if(crop==="നെല്ല്") return 11000;
    return rates[crop] || 0;
  }

  function formatINR(n){ return "₹"+Number(n||0).toLocaleString("en-IN"); }

  function render(){
    tags.innerHTML="";
    let total=0;
    crops.forEach((x,i)=>{
      const rate=getRate(x.crop,x.stage);
      const amount=rate*Number(x.count||0);
      total+=amount;
      const row=document.createElement("div"); row.className="crop-row";
      row.innerHTML='<div class="crop-info"><strong>'+x.crop+'</strong> – '+x.stage+' – <strong>'+x.count+'</strong> എണ്ണം<div class="crop-amount">Rate: '+formatINR(rate)+' × '+x.count+' = '+formatINR(amount)+'</div></div><button type="button" data-i="'+i+'">×</button>';
      tags.appendChild(row);
    });
    const additional=extra&&extra.value.trim()? ["Additional: "+extra.value.trim()] : [];
    hidden.value=crops.map(x=>x.crop+" – "+x.stage+" – "+x.count+" എണ്ണം").concat(additional).join(", ");
    let totalBox=document.getElementById("cropTotalBox");
    if(!totalBox){ totalBox=document.createElement("div"); totalBox.id="cropTotalBox"; tags.parentNode.insertBefore(totalBox, tags.nextSibling); }
    totalBox.className="crop-total";
    totalBox.textContent="💰 മൊത്തം നഷ്ടപരിഹാരം: "+formatINR(total);
    if(amountField) amountField.value=total>0?total:"";
  }

  add.addEventListener("click",function(){
    const c=select.value,s=stage.value,n=count.value.trim();
    if(!c) return alert("വിള തിരഞ്ഞെടുക്കുക.");
    if(!s) return alert("വിളയുടെ അവസ്ഥ തിരഞ്ഞെടുക്കുക.");
    if(!n || Number(n)<1) return alert("വിളയുടെ എണ്ണം നൽകുക.");
    const rate=getRate(c,s);
    if(!rate) return alert("ഈ വിളയ്ക്ക് rate ലഭ്യമല്ല.");
    crops.push({crop:c,stage:s,count:Number(n),rate:rate}); render();
    select.value=""; stage.value=""; count.value="";
  });
  tags.addEventListener("click",function(e){ if(e.target.dataset.i!==undefined){ crops.splice(Number(e.target.dataset.i),1); render(); }});
  extra?.addEventListener("input",render);

  document.getElementById("saveCropBtn")?.addEventListener("click",function(){
    render();
    const msg=document.getElementById("cropSaveStatus");
    if(!hidden.value.trim()){
      msg.textContent="⚠️ ആദ്യം കുറഞ്ഞത് ഒരു വിള ചേർക്കുക.";
      msg.style.color="#9b2020";
      return;
    }
    try{ sessionStorage.setItem("compensation_crop_draft", hidden.value); }catch(e){}
    msg.textContent="✅ വിളകളുടെ വിവരം Save ചെയ്തു.";
    msg.style.color="#176b45";
  });

  render();
});
</script>
<script>
const SUPABASE_URL = "https://jrccmucxwgebdurcokix.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-IbSEjr2Nn_TpO-jRAujUQ_q-kugYET";
const form = document.getElementById("compensationForm");
const statusBox = document.getElementById("status");

function val(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

let applicationNoExists = false;
let applicationNoTimer = null;

function setStatus(type, html){
  statusBox.style.display = "block";
  statusBox.className = type || "";
  statusBox.innerHTML = html;
}

async function checkApplicationNumber(showAvailable=true){
  const field=document.getElementById("application_no");
  const box=document.getElementById("applicationNoStatus");
  const no=field.value.trim();
  applicationNoExists=false;
  box.textContent="";
  if(!no) return false;

  clearTimeout(applicationNoTimer);
  box.textContent="Checking...";

  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/check_application_no",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({p_application_no:no})
    });
    if(!res.ok){ box.textContent=""; return false; }
    const exists=await res.json();
    applicationNoExists = exists === true;
    if(applicationNoExists){
      box.innerHTML='⚠️ <strong style="color:#9b2020">ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong> വേറെ നമ്പർ നൽകുക.';
    }else if(showAvailable){
      box.innerHTML='✅ <span style="color:#176b45">അപേക്ഷ നമ്പർ ലഭ്യമാണ്.</span>';
    }
    return applicationNoExists;
  }catch(err){
    box.textContent="";
    return false;
  }
}

document.getElementById("application_no")?.addEventListener("blur",()=>checkApplicationNumber(true));
document.getElementById("application_no")?.addEventListener("change",()=>checkApplicationNumber(true));

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  setStatus("", "Saving...");

  const appNo = val("application_no");
  if(appNo && !/^\d{4,}$/.test(appNo)){
    setStatus("error","⚠️ <strong>അപേക്ഷ നമ്പർ നൽകുന്നെങ്കിൽ കുറഞ്ഞത് 4 അക്കങ്ങൾ വേണം.</strong>");
    document.getElementById("application_no").focus(); return;
  }
  const gun = (document.querySelector('input[name="gun_license"]:checked')||{}).value || "";
  const forest = (document.querySelector('input[name="forest_crime_accused"]:checked')||{}).value || "";
  if(gun === "ഉണ്ട്" || forest === "ഉണ്ട്"){
    setStatus("error","❌ <strong>ഈ സാഹചര്യത്തിൽ അപേക്ഷ സമർപ്പിക്കാൻ കഴിയില്ല.</strong><br>Gun ലൈസൻസ് / വന സംബന്ധമായ കുറ്റകൃത്യ വിവരം പരിശോധിക്കുക.");
    return;
  }
  const exists = appNo ? await checkApplicationNumber(false) : false;
  if(exists){
    setStatus("error",
      "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>വേറെ അപേക്ഷ നമ്പർ നൽകുക.");
    return;
  }

  // Always build crop data directly from the selected crop rows.
  const selectedCrops = Array.isArray(window.selectedCompensationCrops)
    ? window.selectedCompensationCrops
    : [];
  const additionalCrop = val("cropAdditional");
  const cropParts = selectedCrops.map(x =>
    String(x.crop).trim()+" – "+String(x.stage).trim()+" – "+String(x.count).trim()+" എണ്ണം"
  );
  if(additionalCrop) cropParts.push("Additional: "+additionalCrop);
  const damagedCropsValue = cropParts.join(", ");

  if(!damagedCropsValue){
    setStatus("error","⚠️ കുറഞ്ഞത് ഒരു നാശം സംഭവിച്ച വിളയെങ്കിലും ചേർക്കുക.");
    document.getElementById("cropSelect").focus();
    return;
  }

  // Keep hidden field synchronized too.
  document.getElementById("damagedCropsHidden").value = damagedCropsValue;

  const data={
    application_no:appNo || null,
    applicant_name:val("applicant_name"),
    applicant_address:val("applicant_address"),
    age:val("age") ? Number(val("age")) : null,
    inspection_date:val("inspection_date") || null,
    mobile:val("mobile"),
    damage_location:val("damage_location"),
    wild_animal:val("wild_animal"),
    gun_license:gun,
    forest_crime_accused:forest,
    damaged_crops:damagedCropsValue,
    damage_details:val("damage_details"),
    latitude:val("latitude"),
    longitude:val("longitude"),
    witness_names:val("witness_names"),
    witness_numbers:val("witness_numbers"),
    officer_name:val("officer_name"),
    area:val("area"),
    compensation_amount:val("compensation_amount") ? Number(val("compensation_amount")) : null
  };

  try{
    setStatus("", "Saving...");
    const response=await fetch(SUPABASE_URL+"/rest/v1/compensation_cases",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(data)
    });

    if(!response.ok){
      const errorText=await response.text();
      if(response.status===409 || errorText.includes("23505") || errorText.toLowerCase().includes("duplicate")){
        setStatus("error",
          "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>വേറെ അപേക്ഷ നമ്പർ നൽകുക.");
        return;
      }
      throw new Error(errorText);
    }

    setStatus("success","✅ <strong>Saved successfully!</strong>");
    form.reset();
    if(Array.isArray(window.selectedCompensationCrops)){
      window.selectedCompensationCrops.length=0;
      const tags=document.getElementById("cropTags");
      if(tags) tags.innerHTML="";
      const hidden=document.getElementById("damagedCropsHidden");
      if(hidden) hidden.value="";
    }
    document.getElementById("applicationNoStatus").textContent="";
  }catch(error){
    console.error(error);
    setStatus("error",
      "❌ <strong>Save failed.</strong><br>കാരണം: "+(error.message || "Unknown error"));
  }
});

document.getElementById("gpsBtn")?.addEventListener("click",()=>{
  const status=document.getElementById("gpsStatus");
  if(!navigator.geolocation){status.textContent="GPS not supported.";return;}
  status.textContent="Getting location...";
  navigator.geolocation.getCurrentPosition(
    pos=>{
      document.getElementById("latitude").value=pos.coords.latitude.toFixed(6);
      document.getElementById("longitude").value=pos.coords.longitude.toFixed(6);
      status.textContent="✅ GPS captured.";
    },
    ()=>{status.textContent="❌ GPS permission/location unavailable.";}
  );
});
</script></body>
</html>
