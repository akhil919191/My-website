
<script id="crop-selector-script">
document.addEventListener("DOMContentLoaded", function(){
  const select=document.getElementById("cropSelect");
  const stage=document.getElementById("cropStage");
  const add=document.getElementById("addCropBtn");
  const tags=document.getElementById("cropTags");
  const extra=document.getElementById("cropAdditional");
  const hidden=document.getElementById("damagedCropsHidden");
  if(!select || !stage || !add || !tags || !hidden) return;

  const crops=[];
  function render(){
    tags.innerHTML="";
    crops.forEach((item,i)=>{
      const tag=document.createElement("span");
      tag.style.cssText="padding:7px 10px;border-radius:999px;background:#eef4ff;color:#155eef;font-weight:700";
      tag.innerHTML=item+" <button type='button' data-i='"+i+"' style='border:0;background:none;color:#d92d20;font-weight:900'>×</button>";
      tags.appendChild(tag);
    });
    hidden.value=crops.join(", ");
  }
  add.addEventListener("click",function(){
    const c=select.value, s=stage.value;
    if(!c) return alert("വിള തിരഞ്ഞെടുക്കുക.");
    if(!s) return alert("വിളയുടെ അവസ്ഥ തിരഞ്ഞെടുക്കുക.");
    const value=c+" – "+s;
    if(!crops.includes(value)) crops.push(value);
    render();
    select.value=""; stage.value="";
  });
  tags.addEventListener("click",function(e){
    if(e.target.dataset.i!==undefined){
      crops.splice(Number(e.target.dataset.i),1); render();
    }
  });
  if(extra){
    extra.addEventListener("input",function(){
      const extras=this.value.trim();
      const base=crops.filter(x=>!x.startsWith("Additional:"));
      if(extras) base.push("Additional: "+extras);
      hidden.value=base.join(", ");
    });
  }
  render();
});

document.addEventListener("submit", function(e){
  const form=e.target;
  if(!form || !form.matches("form")) return;
  const app=form.querySelector('[name="application_no"]');
  const officer=form.querySelector('[name="officer_name"]');
  if(app && !/^\d{4,}$/.test(app.value.trim())){
    e.preventDefault();
    alert("അപ്ലിക്കേഷൻ നമ്പർ കുറഞ്ഞത് 4 അക്കമെങ്കിലും വേണം.");
    app.focus(); return;
  }
  if(officer && !officer.value.trim()){
    e.preventDefault();
    alert("പരിശോധിച്ച ഉദ്യോഗസ്ഥന്റെ പേര് നിർബന്ധമാണ്.");
    officer.focus(); return;
  }
  const crops=form.querySelector("#damagedCropsHidden");
  if(crops && !crops.value.trim()){
    e.preventDefault();
    alert("കുറഞ്ഞത് ഒരു വിള തിരഞ്ഞെടുക്കുക.");
  }
}, true);
</script>
<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

@media(max-width:600px){.row,.search-row{grid-template-columns:1fr}.card{padding:16px}}

<style id="crop-ui-style">

.crop-section button{padding:10px 14px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:700}

</head>
<body>
<header class="header">
<h1>COMPENSATION</h1>
<p>കൃഷിനാശ നഷ്ടപരിഹാര അപേക്ഷ</p>
</header>

<main class="container">

<div class="field crop-section">
  <label for="cropSelect">🌾 കൃഷിനാശം സംഭവിച്ച വിളകൾ <span class="required">*</span></label>
  <select id="cropSelect">
    <option value="">വിള തിരഞ്ഞെടുക്കുക</option>
    <option value="തെങ്ങ്">തെങ്ങ്</option>
    <option value="കവുങ്ങ്">കവുങ്ങ്</option>
    <option value="കാപ്പി">കാപ്പി</option>
    <option value="കുരുമുളക്">കുരുമുളക്</option>
    <option value="ഏത്തവാഴ">ഏത്തവാഴ</option>
    <option value="വെജിറ്റബിൾ">വെജിറ്റബിൾ</option>
    <option value="ഇഞ്ചി">ഇഞ്ചി</option>
    <option value="മരച്ചീനി">മരച്ചീനി</option>
    <option value="കശുവണ്ടി">കശുവണ്ടി</option>
    <option value="വാഴ">വാഴ</option>
    <option value="നെല്ല്">നെല്ല്</option>
    <option value="റബ്ബർ">റബ്ബർ</option>
    <option value="മാവ്">മാവ്</option>
    <option value="പ്ലാവ്">പ്ലാവ്</option>
    <option value="മറ്റുള്ളവ">മറ്റുള്ളവ</option>
  </select>

  <select id="cropStage" style="margin-top:8px">
    <option value="">അവസ്ഥ തിരഞ്ഞെടുക്കുക</option>
    <option value="കായ്ച്ചത്">കായ്ച്ചത്</option>
    <option value="കുലച്ചത്">കുലച്ചത്</option>
    <option value="പഴുത്തത്">പഴുത്തത്</option>
    <option value="വളർച്ചയിൽ">വളർച്ചയിൽ</option>
    <option value="പൂവിട്ടത്">പൂവിട്ടത്</option>
    <option value="തൈ/ചെടി">തൈ/ചെടി</option>
  </select>

  <button type="button" id="addCropBtn" style="margin-top:8px">＋ വിള ചേർക്കുക</button>
  <div id="cropTags" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px"></div>

  <input type="text" id="cropAdditional" placeholder="Additional crop / type ഇവിടെ ടൈപ്പ് ചെയ്യാം" style="margin-top:8px">
  <input type="hidden" name="damaged_crops" id="damagedCropsHidden">
</div>

<button type="button" class="secondary" id="gpsBtn">📍 GPS Location എടുക്കുക</button>
<div id="gpsStatus" class="small" style="margin-top:8px"></div>

<label>സ്ഥലത്തിന്റെ ഫോട്ടോ</label>
<div class="photo-box">
  <input id="cameraPhoto" type="file" accept="image/*" capture="environment" style="display:none">
  <input id="galleryPhoto" type="file" accept="image/*" style="display:none">
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button type="button" class="secondary" id="cameraBtn">📷 Camera</button>
    <button type="button" class="secondary" id="galleryBtn">🖼️ Gallery</button>
  </div>
  <input id="photo" type="hidden">
  <div id="photoName" class="small" style="margin-top:8px"></div>
  <div id="photoPreview" style="margin-top:10px;display:none">
    <img id="photoPreviewImg" alt="Selected photo" style="width:100%;max-width:420px;border-radius:12px;display:block">
  </div>
  <div class="small" style="margin-top:8px">ഫോട്ടോ എടുക്കുകയോ Gallery-യിൽ നിന്ന് തിരഞ്ഞെടുക്കുകയോ ചെയ്യാം</div>
</div>

<label>സാക്ഷിയുടെ പേര്</label><input id="witness_names" type="text">
<label>സാക്ഷിയുടെ നമ്പർ</label><input id="witness_numbers" type="tel">
<label>പരിശോധന ഉദ്യോഗസ്ഥൻ</label><input id="officer_name" required type="text">
<label>വിസ്തീർണ്ണം</label><input id="area" type="text" placeholder="ഉദാ: 0.50 ഏക്കർ">
<label>നഷ്ടപരിഹാര തുക</label><input id="compensation_amount" type="number" min="0" step="0.01" placeholder="₹">

<button class="primary" type="submit">💾 SAVE</button>
<div id="status"></div>
</form>
</div>


</main>

<script>
const SUPABASE_URL = "https://jrccmucxwgebdurcokix.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-IbSEjr2Nn_TpO-jRAujUQ_q-kugYET";
const PHOTO_BUCKET = "compensation-photos";

const form = document.getElementById("compensationForm");
const statusBox = document.getElementById("status");

function val(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

let selectedPhotoFile = null;
let applicationNoExists = false;
let applicationNoTimer = null;

function setStatus(type, html){
  statusBox.style.display = "block";
  statusBox.className = type || "";
  statusBox.innerHTML = html;
}

function previewPhoto(file){
  selectedPhotoFile = file || null;
  const img = document.getElementById("photoPreviewImg");
  const box = document.getElementById("photoPreview");
  const name = document.getElementById("photoName");
  if(!file){
    box.style.display="none";
    img.removeAttribute("src");
    name.textContent="";
    return;
  }
  name.textContent = "📷 " + file.name;
  const url = URL.createObjectURL(file);
  img.src = url;
  box.style.display = "block";
}

document.getElementById("cameraBtn")?.addEventListener("click",()=>document.getElementById("cameraPhoto").click());
document.getElementById("galleryBtn")?.addEventListener("click",()=>document.getElementById("galleryPhoto").click());
document.getElementById("cameraPhoto")?.addEventListener("change",e=>{
  const f=e.target.files?.[0];
  if(f) previewPhoto(f);
});
document.getElementById("galleryPhoto")?.addEventListener("change",e=>{
  const f=e.target.files?.[0];
  if(f) previewPhoto(f);
});

async function checkApplicationNumber(showAvailable=true){
  const field=document.getElementById("application_no");
  const box=document.getElementById("applicationNoStatus");
  const no=field.value.trim();
  applicationNoExists=false;
  box.textContent="";
  if(!no) return false;

  clearTimeout(applicationNoTimer);
  box.textContent="Checking...";

  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/check_application_no",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({p_application_no:no})
    });
    if(!res.ok){ box.textContent=""; return false; }
    const exists=await res.json();
    applicationNoExists = exists === true;
    if(applicationNoExists){
      box.innerHTML='⚠️ <strong style="color:#9b2020">ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong> വേറെ നമ്പർ നൽകുക.';
    }else if(showAvailable){
      box.innerHTML='✅ <span style="color:#176b45">അപേക്ഷ നമ്പർ ലഭ്യമാണ്.</span>';
    }
    return applicationNoExists;
  }catch(err){
    box.textContent="";
    return false;
  }
}

document.getElementById("application_no")?.addEventListener("blur",()=>checkApplicationNumber(true));
document.getElementById("application_no")?.addEventListener("change",()=>checkApplicationNumber(true));

async function uploadPhoto(file, applicationNo){
  if(!file) return null;
  const safeNo = applicationNo.replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,80);
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = safeNo + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,10) + "." + ext;

  const res = await fetch(
    SUPABASE_URL + "/storage/v1/object/" + PHOTO_BUCKET + "/" + path,
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":file.type || "image/jpeg",
        "x-upsert":"false"
      },
      body:file
    }
  );
  if(!res.ok){
    const t=await res.text();
    throw new Error("Photo upload failed: " + t);
  }
  return path;
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  setStatus("", "Saving...");

  const exists = await checkApplicationNumber(false);
  if(exists){
    setStatus("error",
      "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>വേറെ അപേക്ഷ നമ്പർ നൽകുക.");
    return;
  }

  const data={
    application_no:val("application_no"),
    applicant_name:val("applicant_name"),
    applicant_address:val("applicant_address"),
    age:val("age") ? Number(val("age")) : null,
    mobile:val("mobile"),
    damage_location:val("damage_location"),
    wild_animal:val("wild_animal"),
    damaged_crops:val("damaged_crops"),
    damage_details:val("damage_details"),
    latitude:val("latitude"),
    longitude:val("longitude"),
    photo_name:null,
    witness_names:val("witness_names"),
    witness_numbers:val("witness_numbers"),
    officer_name:val("officer_name"),
    area:val("area"),
    compensation_amount:val("compensation_amount") ? Number(val("compensation_amount")) : null
  };

  let uploadedPath=null;
  try{
    if(selectedPhotoFile){
      setStatus("", "📷 Photo uploading...");
      uploadedPath=await uploadPhoto(selectedPhotoFile,data.application_no);
      data.photo_name=uploadedPath;
    }

    setStatus("", "Saving...");
    const response=await fetch(SUPABASE_URL+"/rest/v1/compensation_cases",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(data)
    });

    if(!response.ok){
      const errorText=await response.text();
      if(response.status===409 || errorText.includes("23505") || errorText.toLowerCase().includes("duplicate")){
        setStatus("error",
          "⚠️ <strong>ഈ അപേക്ഷ നമ്പർ ഇതിനകം നിലവിലുണ്ട്.</strong><br>വേറെ അപേക്ഷ നമ്പർ നൽകുക.");
        return;
      }
      throw new Error(errorText);
    }

    setStatus("success","✅ <strong>Saved successfully!</strong>");
    form.reset();
    selectedPhotoFile=null;
    previewPhoto(null);
    document.getElementById("applicationNoStatus").textContent="";
  }catch(error){
    console.error(error);
    setStatus("error",
      "❌ <strong>Save failed.</strong><br>കാരണം: "+(error.message || "Unknown error"));
  }
});

document.getElementById("gpsBtn")?.addEventListener("click",()=>{
  const status=document.getElementById("gpsStatus");
  if(!navigator.geolocation){status.textContent="GPS not supported.";return;}
  status.textContent="Getting location...";
  navigator.geolocation.getCurrentPosition(
    pos=>{
      document.getElementById("latitude").value=pos.coords.latitude.toFixed(6);
      document.getElementById("longitude").value=pos.coords.longitude.toFixed(6);
      status.textContent="✅ GPS captured.";
    },
    ()=>{status.textContent="❌ GPS permission/location unavailable.";}
  );
});
</script>

<script>
(function(){
  const input=document.getElementById("photo");
  const box=document.getElementById("photoPreview");
  const img=document.getElementById("photoPreviewImg");
  if(!input || !box || !img) return;
  input.addEventListener("change", function(){
    const file=this.files && this.files[0];
    if(!file){ box.style.display="none"; img.removeAttribute("src"); return; }
    const url=URL.createObjectURL(file);
    img.src=url;
    box.style.display="block";
  });
})();
</script>
</body>
</html>
